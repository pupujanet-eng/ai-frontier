name: Daily Digest + Deploy

on:
  schedule:
    - cron: "17 0,3,6,12 * * *" # 北京时间 08:17 首次；11:17/14:17/20:17 自动补跑，完整则跳过
  workflow_dispatch:
    inputs:
      skip_generate:
        description: "仅部署已有完整日报，不调用模型；取消勾选才尝试生成新一期（仍受当日熔断限制）"
        type: boolean
        default: true
      resume_model_service:
        description: "已更新 API key 或恢复服务：解除接口错误熔断，保留当日用量和预算限制"
        type: boolean
        default: false
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_GENERATE: ${{ inputs.skip_generate || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy cached]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Explain selected operation
        run: |
          if [ "$SKIP_GENERATE" = "true" ]; then
            echo '### 本次仅部署完整日报' >> "$GITHUB_STEP_SUMMARY"
            echo '不调用模型，不修改当日费用账本。恢复已刊或核对后的补编内容，再校验并发布。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### 本次尝试生成并部署' >> "$GITHUB_STEP_SUMMARY"
            echo '只有生成完整时才发布。重复运行不会重置预算、请求次数或校验失败计数；如仅需更新页面，请新建手动运行并勾选 skip_generate。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate code and editorial data
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
      - name: Restore recent editions and GitHub history
        uses: actions/cache/restore@v4
        with:
          path: |
            data/digests
            data/github-seen.json
          key: digest-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: digest-v2-
      - name: Restore validated model checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .digest-cache
          key: model-checkpoints-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-checkpoints-v1-
      - name: Check restored edition
        id: edition_cache
        continue-on-error: true
        run: npx tsx scripts/verify-edition.ts
      - name: Restore verified edition archive
        if: ${{ steps.edition_cache.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            const candidates = artifacts.filter(a => a.name.startsWith('digest-data-') && !a.expired).sort((a,b) => b.id-a.id).slice(0,5);
            let recovered = false;
            for (const artifact of candidates) {
              try {
                const archive = await github.rest.actions.downloadArtifact({...context.repo, artifact_id: artifact.id, archive_format: 'zip'});
                await fs.writeFile('/tmp/verified-editions.zip', Buffer.from(archive.data));
                await exec.exec('python3', ['scripts/extract-editions.py', '/tmp/verified-editions.zip', '/tmp/verified-editions']);
                await exec.exec('npx', ['tsx', 'scripts/verify-edition.ts', '/tmp/verified-editions/digests/latest.json']);
                await fs.cp('/tmp/verified-editions/digests', 'data/digests', {recursive: true});
                await fs.copyFile('/tmp/verified-editions/github-seen.json', 'data/github-seen.json').catch(() => {});
                core.notice(`Recovered verified edition archive ${artifact.id}`);
                recovered = true;
                break;
              } catch { core.warning(`Archive ${artifact.id} could not be verified; trying an older snapshot`); }
            }
            if (!recovered) core.warning('No verified edition archive is available; trying tracked reviewed editions before the publication gate');
      - name: Apply reviewed complete editions
        run: npx tsx scripts/apply-reviewed-editions.ts
      - name: Restore daily model budget
        id: budget
        if: ${{ env.SKIP_GENERATE != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/restore-model-budget.cjs')({ github, context, core });
      - name: Extract daily model budget
        if: ${{ steps.budget.outputs.downloaded == 'true' }}
        env:
          BUDGET_DATE: ${{ steps.budget.outputs.date }}
        run: unzip -p .model-budget/restore.zip "$BUDGET_DATE.json" > ".model-budget/$BUDGET_DATE.json"
      - name: Generate daily digest
        if: ${{ env.SKIP_GENERATE != 'true' }}
        timeout-minutes: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || '' }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL || '' }}
          DAILY_MODEL_BUDGET_USD: ${{ vars.DAILY_MODEL_BUDGET_USD || '5' }}
          DAILY_MODEL_MAX_CALLS: ${{ vars.DAILY_MODEL_MAX_CALLS || '80' }}
          DAILY_MODEL_MAX_FAILURES: ${{ vars.DAILY_MODEL_MAX_FAILURES || '12' }}
          RESUME_MODEL_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_model_service && 'true' || 'false' }}
        run: npm run generate
      - name: Save daily model budget even after failure
        if: ${{ always() && steps.budget.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: model-budget-${{ steps.budget.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .model-budget/${{ steps.budget.outputs.date }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Save validated model checkpoints
        if: ${{ always() && env.SKIP_GENERATE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .digest-cache
          key: model-checkpoints-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive editorial diagnostics
        if: ${{ always() && env.SKIP_GENERATE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .digest-cache/diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Require both editorial sections before publishing
        run: npx tsx scripts/verify-edition.ts
      - name: Save verified editions
        uses: actions/cache/save@v4
        with:
          path: |
            data/digests
            data/github-seen.json
          key: digest-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /ai-frontier
        run: npm run build
      - name: Archive generated data
        uses: actions/upload-artifact@v4
        with:
          name: digest-data-${{ github.run_id }}
          path: |
            data/digests
            data/github-seen.json
          retention-days: 90
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
