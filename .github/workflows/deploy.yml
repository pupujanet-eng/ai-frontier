name: Daily Digest + Deploy

on:
  schedule:
    - cron: "17 0,3,6,12 * * *" # 北京时间 08:17 首次；11:17/14:17/20:17 自动补跑，完整则跳过
  workflow_dispatch:
    inputs:
      skip_generate:
        description: "跳过生成，使用最近保存的日报构建"
        type: boolean
        default: false
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_GENERATE: ${{ inputs.skip_generate || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy cached]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate code and editorial data
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
      - name: Restore recent editions and GitHub history
        uses: actions/cache/restore@v4
        with:
          path: |
            data/digests
            data/github-seen.json
          key: digest-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: digest-v2-
      - name: Restore validated model checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .digest-cache
          key: model-checkpoints-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-checkpoints-v1-
      - name: Generate daily digest
        if: ${{ env.SKIP_GENERATE != 'true' }}
        timeout-minutes: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || '' }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL || '' }}
        run: npm run generate
      - name: Save validated model checkpoints
        if: ${{ always() && env.SKIP_GENERATE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .digest-cache
          key: model-checkpoints-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive editorial diagnostics
        if: ${{ always() && env.SKIP_GENERATE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .digest-cache/diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Require both editorial sections before publishing
        run: npx tsx scripts/verify-edition.ts
      - name: Save verified editions
        if: ${{ env.SKIP_GENERATE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/digests
            data/github-seen.json
          key: digest-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /ai-frontier
        run: npm run build
      - name: Archive generated data
        uses: actions/upload-artifact@v4
        with:
          name: digest-data-${{ github.run_id }}
          path: |
            data/digests
            data/github-seen.json
          retention-days: 90
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
