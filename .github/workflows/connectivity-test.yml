name: Connectivity Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe IdeaLab reachability
        run: |
          echo "=== DNS ==="
          getent hosts idealab.alibaba-inc.com || echo "DNS lookup failed"
          echo "=== curl (30s cap) ==="
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code} | connect=%{time_connect}s | total=%{time_total}s | ip=%{remote_ip}\n" \
            "https://idealab.alibaba-inc.com/api/openai/v1/models" \
            -H "Authorization: Bearer test" || echo "curl exit code: $?"
          echo "=== raw TCP 443 (nc) ==="
          timeout 15 bash -c 'echo > /dev/tcp/idealab.alibaba-inc.com/443' && echo "TCP 443 OK" || echo "TCP 443 FAILED (exit $?)"
